<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <defs>
    <!-- glass body: cool steel translucency, brighter at the apex -->
    <linearGradient id="glass" x1="128" y1="34" x2="128" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e9eff4" stop-opacity="0.5"/>
      <stop offset="0.4" stop-color="#5d9cc4" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#1c567c" stop-opacity="0.52"/>
    </linearGradient>
    <!-- inner refraction glow at the exit point -->
    <radialGradient id="core" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(160 142) scale(72)">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#7fb6d9" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#7fb6d9" stop-opacity="0"/>
    </radialGradient>
    <!-- glass edge highlight -->
    <linearGradient id="edge" x1="70" y1="50" x2="200" y2="214" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#7fb6d9" stop-opacity="0.6"/>
    </linearGradient>
    <!-- one continuous beam: enters, widens in the glass, brightest at the exit face -->
    <linearGradient id="beamIn" x1="0" y1="148" x2="178" y2="146" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#ffffff" stop-opacity="0.72"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="1"/>
    </linearGradient>
    <!-- dispersed rays : white-hot at the face, melting into each colour -->
    <linearGradient id="rayAI" x1="164" y1="128" x2="256" y2="66" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#eef6fd" stop-opacity="1"/>
      <stop offset="0.3" stop-color="#8ec4ef" stop-opacity="0.9"/>
      <stop offset="0.7" stop-color="#4d90c6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#4d90c6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rayData" x1="168" y1="136" x2="256" y2="112" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ecfaf6" stop-opacity="1"/>
      <stop offset="0.3" stop-color="#6fd9c4" stop-opacity="0.9"/>
      <stop offset="0.7" stop-color="#2fa793" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2fa793" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rayLive" x1="170" y1="146" x2="256" y2="152" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#eefcf5" stop-opacity="0.95"/>
      <stop offset="0.3" stop-color="#7fe3b8" stop-opacity="0.85"/>
      <stop offset="0.7" stop-color="#3bb582" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3bb582" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rayProto" x1="172" y1="154" x2="254" y2="192" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fdf6e8" stop-opacity="0.95"/>
      <stop offset="0.3" stop-color="#ecc978" stop-opacity="0.85"/>
      <stop offset="0.7" stop-color="#c99a35" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#c99a35" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="rayIBO" x1="175" y1="162" x2="248" y2="226" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f3f0fc" stop-opacity="1"/>
      <stop offset="0.3" stop-color="#bcaef0" stop-opacity="0.9"/>
      <stop offset="0.7" stop-color="#8672d4" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#8672d4" stop-opacity="0"/>
    </linearGradient>
    <!-- narrow sheen along the upper-left face -->
    <linearGradient id="sheen" x1="100" y1="60" x2="70" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="prismClip">
      <path d="M116.5 41.5c4.6-8.6 18.4-8.6 23 0l68.5 152.6c4.2 9.3-2 20.4-11.5 20.4H59.5c-9.5 0-15.7-11.1-11.5-20.4L116.5 41.5Z"/>
    </clipPath>
    <!-- soft light: blurs that melt hard polygon edges into beams -->
    <filter id="softFan" x="-15%" y="-15%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="softBeam" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>

  <!-- ══ dispersed spectrum: contiguous fan from the exit face, blurred to blend ══ -->
  <g filter="url(#softFan)">
    <path d="M163 128 L256 48 L256 94 L167 138 Z" fill="url(#rayAI)"/>
    <path d="M166 136 L256 92 L256 132 L170 145 Z" fill="url(#rayData)"/>
    <path d="M169 144 L256 130 L256 168 L173 153 Z" fill="url(#rayLive)"/>
    <path d="M172 152 L256 166 L256 206 L176 161 Z" fill="url(#rayProto)"/>
    <path d="M175 160 L256 204 L256 250 L179 169 Z" fill="url(#rayIBO)"/>
  </g>

  <!-- ══ the white beam: cool penumbra keeps it visible on light grounds ══ -->
  <path d="M0 143 L82 141 L172 128 L180 166 L82 153 L0 153 Z" fill="none"
    stroke="#3d7196" stroke-opacity="0.4" stroke-width="7" filter="url(#softFan)"/>
  <path d="M0 143 L82 141 L172 128 L180 166 L82 153 L0 153 Z" fill="url(#beamIn)" filter="url(#softBeam)"/>

  <!-- ══ prism body : rounded triangle of liquid glass ══ -->
  <path d="M116.5 41.5c4.6-8.6 18.4-8.6 23 0l68.5 152.6c4.2 9.3-2 20.4-11.5 20.4H59.5c-9.5 0-15.7-11.1-11.5-20.4L116.5 41.5Z"
    fill="url(#glass)"/>
  <path d="M116.5 41.5c4.6-8.6 18.4-8.6 23 0l68.5 152.6c4.2 9.3-2 20.4-11.5 20.4H59.5c-9.5 0-15.7-11.1-11.5-20.4L116.5 41.5Z"
    fill="url(#core)"/>

  <!-- inside the glass -->
  <g clip-path="url(#prismClip)">
    <!-- caustic pooling at the base -->
    <ellipse cx="128" cy="216" rx="80" ry="14" fill="#7fb6d9" opacity="0.25"/>
    <!-- narrow sheen along the upper-left face -->
    <path d="M109 58 L117 58 L73 186 L62 186 Z" fill="url(#sheen)" opacity="0.4"/>
  </g>

  <!-- glass edge: steel contour beneath a bright rim so the shape reads on any ground -->
  <path d="M116.5 41.5c4.6-8.6 18.4-8.6 23 0l68.5 152.6c4.2 9.3-2 20.4-11.5 20.4H59.5c-9.5 0-15.7-11.1-11.5-20.4L116.5 41.5Z"
    stroke="#1c567c" stroke-opacity="0.55" stroke-width="6" stroke-linejoin="round"/>
  <path d="M116.5 41.5c4.6-8.6 18.4-8.6 23 0l68.5 152.6c4.2 9.3-2 20.4-11.5 20.4H59.5c-9.5 0-15.7-11.1-11.5-20.4L116.5 41.5Z"
    stroke="url(#edge)" stroke-width="3.5" stroke-linejoin="round"/>
</svg>
