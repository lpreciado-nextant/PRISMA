<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <defs>
    <!-- crown facets: amber light pouring into violet -->
    <linearGradient id="p2-crownL" x1="92" y1="20" x2="72" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f2dfae"/>
      <stop offset="0.55" stop-color="#d3b3d4"/>
      <stop offset="1" stop-color="#bda9ec"/>
    </linearGradient>
    <linearGradient id="p2-crownM" x1="128" y1="20" x2="128" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#eec173"/>
      <stop offset="0.55" stop-color="#c08fb4"/>
      <stop offset="1" stop-color="#a98fe0"/>
    </linearGradient>
    <linearGradient id="p2-crownR" x1="165" y1="20" x2="192" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#d99c3e"/>
      <stop offset="0.55" stop-color="#a06cb8"/>
      <stop offset="1" stop-color="#7f68c9"/>
    </linearGradient>
    <!-- pavilion: violet settling through steel blue into teal -->
    <linearGradient id="p2-pav" x1="128" y1="140" x2="128" y2="210" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#9f8ede"/>
      <stop offset="0.5" stop-color="#5fa7d6"/>
      <stop offset="1" stop-color="#4fbfab"/>
    </linearGradient>
    <linearGradient id="p2-girdle" x1="44" y1="140" x2="212" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- pavilion: girdle tapering to a narrower flat base -->
  <path d="M44 140 L212 140 L182 210 L74 210 Z" fill="url(#p2-pav)"/>
  <!-- crown lines carried straight through to the base vertices -->
  <path d="M44 140 L94 140 L74 210 Z" fill="#ffffff" opacity="0.2"/>
  <path d="M162 140 L212 140 L182 210 Z" fill="#1c567c" opacity="0.2"/>
  <!-- the single diagonal: light bouncing from girdle-left to base-right -->
  <path d="M44 140 L212 140 L182 210 Z" fill="#eaf5fb" opacity="0.26"/>

  <!-- crown: three vertical facets from the apex -->
  <path d="M128 20 L44 140 L94 140 Z" fill="url(#p2-crownL)"/>
  <path d="M128 20 L94 140 L162 140 Z" fill="url(#p2-crownM)"/>
  <path d="M128 20 L162 140 L212 140 Z" fill="url(#p2-crownR)"/>

  <!-- girdle seam catching the light -->
  <path d="M44 140 L212 140" stroke="url(#p2-girdle)" stroke-width="1.6"/>
</svg>
